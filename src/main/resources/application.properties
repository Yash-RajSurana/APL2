server.port=8080

# Gemini API (Google AI Studio — free tier)
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
gemini.text.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent
gemini.image.url=https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-fast-generate-001:predict

# CricketData.org API
cricket.api.key=YOUR_CRICKETDATA_API_KEY_HERE
cricket.api.url=https://api.cricapi.com/v1
cricket.use.mock=true

spring.main.web-application-type=servlet
# Increase buffer for base64 image responses from Imagen
spring.codec.max-in-memory-size=10MB
